name: FFmpeg audio (LGPL) for StreamX TV
# Builds Media3's own FFmpeg extension (Apache-2.0) against FFmpeg configured WITHOUT --enable-gpl (LGPL-2.1),
# audio decoders only, and uploads the .aar. The app loads it as a separate shared library (LGPL dynamic linking).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Sources (Media3 1.7.1, FFmpeg 6.0)
        run: |
          git clone -q --depth 1 --branch 1.7.1 https://github.com/androidx/media.git media
          git clone -q --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg
      - name: Build FFmpeg (LGPL, audio decoders only)
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $NDK"
          JNI="$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main/jni"
          ln -s "$GITHUB_WORKSPACE/ffmpeg" "$JNI/ffmpeg"
          cd "$JNI"
          ./build_ffmpeg.sh "$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main" "$NDK" linux-x86_64 21 ac3 eac3 dca truehd mlp mp3 aac vorbis opus flac alac
          grep -q "enable-gpl" ffmpeg/ffbuild/config.mak 2>/dev/null && { echo "GPL found"; exit 1; } || true
          grep "^LICENSE\|license" ffmpeg/ffbuild/config.mak | head -3 || true
      - name: Build the extension
        run: |
          cd media
          ./gradlew -q :lib-decoder-ffmpeg:assembleRelease --no-daemon
          find . -name "*.aar" -path "*decoder_ffmpeg*" | head
          mkdir -p ../out && cp $(find . -name "lib-decoder-ffmpeg-release.aar" | head -1) ../out/ffmpeg-audio-lgpl.aar
          cp "$GITHUB_WORKSPACE/ffmpeg/COPYING.LGPLv2.1" ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-audio-lgpl
          path: out/
      - name: Keep the build on branch ffmpeg-bin
        run: |
          cd out
          git init -q -b ffmpeg-bin && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "FFmpeg audio LGPL build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ffmpeg-bin
