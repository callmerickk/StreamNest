name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APKs as a release (off = only check that it builds)"
        type: boolean
        default: true
# Needed to publish the APKs as a GitHub Release (the apps' in-app updater downloads from there).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip the newest uploaded zip
        run: |
          ZIP=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -1)
          echo "Building from: $ZIP"
          rm -rf StreamNest
          unzip -q -o "$ZIP"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          cd StreamNest
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      # On failure: the compiler's error lines become annotations (readable through the GitHub API).
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)|> " build.log | grep -v "^> Task" | head -60 > errs.txt || true
          sed -i 's/%/%25/g' errs.txt
          for chunk in 0 20 40; do
            msg=$(sed -n "$((chunk+1)),$((chunk+20))p" errs.txt | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$msg" ] && echo "::error title=Build errors $chunk::$msg"
          done
          true
      # Phone app
      - uses: actions/upload-artifact@v4
        with:
          name: StreamX-phone-apk
          path: |
            StreamNest/app/build/outputs/apk/phone/debug/*.apk
            StreamNest/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      # StreamX TV (Fire TV / Android TV)
      - uses: actions/upload-artifact@v4
        with:
          name: StreamX-TV-apk
          path: StreamNest/app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: ignore
      # In-app updates: both APKs + versions.json as a GitHub Release.
      - name: Prepare release files
        if: ${{ inputs.publish }}
        run: |
          mkdir -p release
          cp StreamNest/app/build/outputs/apk/phone/debug/*.apk release/StreamX-phone.apk
          cp StreamNest/app/build/outputs/apk/tv/debug/*.apk release/StreamX-TV.apk
          G=StreamNest/app/build.gradle.kts
          PHONE_CODE=$(grep 'versionCode = ' $G | sed -n 1p | grep -o '[0-9]\+')
          TV_CODE=$(grep 'versionCode = ' $G | sed -n 2p | grep -o '[0-9]\+')
          PHONE_NAME=$(grep 'versionName = ' $G | sed -n 1p | sed 's/.*"\(.*\)".*/\1/')
          TV_NAME=$(grep 'versionName = ' $G | sed -n 2p | sed 's/.*"\(.*\)".*/\1/')
          echo "{\"phone\":$PHONE_CODE,\"tv\":$TV_CODE,\"phoneName\":\"$PHONE_NAME\",\"tvName\":\"$TV_NAME\",\"tag\":\"build-${{ github.run_number }}\"}" > release/versions.json
          cat release/versions.json
          echo "TAG=build-${{ github.run_number }}" >> $GITHUB_ENV
          echo "TITLE=StreamX $PHONE_NAME · $TV_NAME" >> $GITHUB_ENV
          if [ -f StreamNest/RELEASE_NOTES.md ]; then cp StreamNest/RELEASE_NOTES.md release/notes.md; else echo "Fixes and improvements." > release/notes.md; fi
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body_path: release/notes.md
          make_latest: true
          files: |
            release/StreamX-phone.apk
            release/StreamX-TV.apk
            release/versions.json
            release/notes.md
