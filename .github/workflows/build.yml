name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip the newest uploaded zip
        run: |
          ZIP=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -1)
          echo "Building from: $ZIP"
          rm -rf StreamNest
          unzip -q -o "$ZIP"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: cd StreamNest && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StreamNest-apk
          path: StreamNest/app/build/outputs/apk/debug/*.apk
