name: Build APK
on: workflow_dispatch
# Needed to publish the APKs as a GitHub Release (the apps' in-app updater downloads from there).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip the newest uploaded zip
        run: |
          ZIP=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -1)
          echo "Building from: $ZIP"
          rm -rf StreamNest
          unzip -q -o "$ZIP"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          cd StreamNest
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      # On failure: the compiler's error lines become annotations (readable through the GitHub API).
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)|> " build.log | grep -v "^> Task" | head -60 > errs.txt || true
          sed -i 's/%/%25/g' errs.txt
          for chunk in 0 20 40; do
            msg=$(sed -n "$((chunk+1)),$((chunk+20))p" errs.txt | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$msg" ] && echo "::error title=Build errors $chunk::$msg"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: StreamNest/app/build/outputs/apk/**/*.apk
